/* ═══════════════════════════════════════════════════════════════
   HASH ROUTER
   ═══════════════════════════════════════════════════════════════ */
function useRouter(){
  const [path,setPath]=useState(window.location.hash.slice(1)||'/');
  useEffect(()=>{
    const h=()=>setPath(window.location.hash.slice(1)||'/');
    window.addEventListener('hashchange',h);
    return ()=>window.removeEventListener('hashchange',h);
  },[]);
  const navigate=useCallback((to)=>{window.location.hash=to;window.scrollTo(0,0);},[]);
  return {path,navigate};
}
function Link({to,children,...props}){
  return <a href={'#'+to} {...props}>{children}</a>;
}

function DashboardPage(){
  const [abstract,setAbstract]=useState('');
  const [keywords,setKeywords]=useState('');
  const [introConc,setIntroConc]=useState('');
  const [methods,setMethods]=useState('');
  const [resultsSummary,setResultsSummary]=useState('');
  const [articleType,setArticleType]=useState('Original Research');
  const [discipline,setDiscipline]=useState('Any');
  const [oaPref,setOaPref]=useState('Any');
  const [apcFree,setApcFree]=useState(false);
  const [maxApc,setMaxApc]=useState('');
  const [minIF,setMinIF]=useState('');
  const [targetImpact,setTargetImpact]=useState('');
  const [indexing,setIndexing]=useState([]);
  const [numResults,setNumResults]=useState(3);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');
  const [results,setResults]=useState(null);
  const [showFilters,setShowFilters]=useState(false);
  const [showMore,setShowMore]=useState(false);
  const [tailorJournal,setTailorJournal]=useState(null);
  const [tailorData,setTailorData]=useState(null);
  const [tailorLoading,setTailorLoading]=useState(false);
  const resultsRef=useRef(null);

  const ARTICLE_TYPES=["Original Research","Review Article","Systematic Review","Meta-Analysis","Case Report","Case Series","Short Communication / Brief Report","Letter to the Editor","Editorial","Commentary / Opinion","Perspective","Methods / Protocols","Technical Note","Book Review","Conference Paper","Data Paper / Data Article"];
  const DISCIPLINES=["Any","Agricultural Sciences","Biochemistry & Molecular Biology","Biomedical Engineering","Chemistry","Clinical Medicine","Computer Science & AI","Earth & Environmental Sciences","Ecology & Evolution","Economics & Business","Education","Engineering","Epidemiology & Public Health","Food Science & Nutrition","Genetics & Genomics","Humanities & Social Sciences","Immunology","Law","Materials Science","Mathematics & Statistics","Microbiology","Neuroscience","Nursing & Health Professions","Pharmacology & Toxicology","Physics & Astronomy","Psychology & Psychiatry","Veterinary Science","Other"];
  const INDEXING=["PubMed/MEDLINE","DOAJ","Scopus","Web of Science","Embase","PsycINFO","CINAHL","ERIC","EconLit","MathSciNet","zbMATH","Chemical Abstracts Service (CAS)","Inspec","GeoRef","AGRIS","Emerging Sources Citation Index (ESCI)","SCImago (SJR)"];

  async function handleSearch(e){
    e.preventDefault();
    if(abstract.length<50){setError('Abstract must be at least 50 characters.');return;}
    setError('');setLoading(true);setResults(null);setTailorJournal(null);setTailorData(null);
    try{
      const body={abstract,keywords,introduction_conclusion:introConc,methods,results_summary:resultsSummary,article_type:articleType,discipline,indexing_required:indexing,oa_preference:oaPref,apc_free_only:apcFree,max_apc:maxApc?parseFloat(maxApc):null,min_impact_factor:minIF?parseFloat(minIF):null,target_impact:targetImpact||null,num_results:numResults,language_preference:'auto'};
      const r=await fetch(API+'/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok){const d=await r.json().catch(()=>({detail:r.statusText}));throw new Error(d.detail||'Request failed');}
      const data=await r.json();
      setResults(data);
      setTimeout(()=>resultsRef.current?.scrollIntoView({behavior:'smooth'}),100);
    }catch(err){setError(err.message);}
    finally{setLoading(false);}
  }

  async function handleTailor(rec){
    setTailorJournal(rec);setTailorData(null);setTailorLoading(true);
    try{
      const body={abstract,keywords,introduction_conclusion:introConc,methods,results_summary:resultsSummary,article_type:articleType,journal_id:rec.journal_id,journal_name:rec.journal_name};
      const r=await fetch(API+'/tailor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok){const d=await r.json().catch(()=>({detail:r.statusText}));throw new Error(d.detail||'Tailor failed');}
      setTailorData(await r.json());
    }catch(err){setTailorData({error:err.message});}
    finally{setTailorLoading(false);}
  }

  async function handleReport(){
    if(!results)return;
    try{
      const body={results,abstract,constraints:{article_type:articleType,discipline,oa_preference:oaPref}};
      const r=await fetch(API+'/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok)throw new Error('Report failed');
      const blob=await r.blob();
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='journal_recommendations.docx';a.click();URL.revokeObjectURL(url);
    }catch(err){alert('Report generation failed: '+err.message);}
  }

  const fitColor=(fit)=>{const f=(fit||'').toLowerCase();if(f.includes('high')||f.includes('excellent'))return'bg-emerald-100 text-emerald-800';if(f.includes('medium')||f.includes('good'))return'bg-amber-100 text-amber-800';return'bg-red-100 text-red-800';};

  return(
    <div className="bg-gray-50 min-h-screen py-12">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div className="mb-8 fade-in"><h1 className="text-4xl font-bold text-[#1E3A8A] mb-2">Find Your Perfect Journal</h1><p className="text-xl text-gray-600">Paste your abstract below and let our AI find the best matches</p></div>
        <div className="grid lg:grid-cols-3 gap-8">
          <div className="lg:col-span-2">
            <form onSubmit={handleSearch} className="bg-white rounded-xl shadow-sm border border-gray-200 p-8 fade-in">
              <h2 className="text-2xl font-bold text-[#1E3A8A] mb-6">New Search</h2>
              <div className="space-y-6">
                {/* Abstract */}
                <div><label className="block text-sm font-semibold text-gray-700 mb-2">Abstract *</label><textarea value={abstract} onChange={e=>setAbstract(e.target.value)} placeholder="Paste your research abstract here..." className="w-full h-48 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent resize-none"/><p className="text-sm text-gray-500 mt-1">Minimum 50 characters ({abstract.length} entered)</p></div>
                {/* Keywords */}
                <div><label className="block text-sm font-semibold text-gray-700 mb-2">Keywords</label><input type="text" value={keywords} onChange={e=>setKeywords(e.target.value)} placeholder="e.g., machine learning, neural networks, deep learning" className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent"/><p className="text-sm text-gray-500 mt-1">Separate keywords with commas</p></div>
                {/* Extra sections toggle */}
                <button type="button" onClick={()=>setShowMore(!showMore)} className="text-sm text-[#14B8A6] font-semibold flex items-center gap-1 hover:underline">{showMore?'▾ Hide':'▸ Show'} additional manuscript sections (optional)</button>
                {showMore&&<div className="space-y-4 pl-4 border-l-2 border-[#14B8A6]/20">
                  <div><label className="block text-sm font-medium text-gray-700 mb-1">Introduction / Conclusion</label><textarea value={introConc} onChange={e=>setIntroConc(e.target.value)} placeholder="Paste the last paragraph of your Introduction and/or Conclusion..." className="w-full h-24 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent resize-none text-sm"/></div>
                  <div><label className="block text-sm font-medium text-gray-700 mb-1">Methods</label><textarea value={methods} onChange={e=>setMethods(e.target.value)} placeholder="Paste your Materials & Methods section..." className="w-full h-24 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent resize-none text-sm"/></div>
                  <div><label className="block text-sm font-medium text-gray-700 mb-1">Results Summary</label><textarea value={resultsSummary} onChange={e=>setResultsSummary(e.target.value)} placeholder="Paste key results or findings..." className="w-full h-24 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent resize-none text-sm"/></div>
                </div>}
                {/* Filters */}
                <div className="border-t pt-6">
                  <button type="button" onClick={()=>setShowFilters(!showFilters)} className="flex items-center gap-2 mb-4"><span className="w-5 h-5 text-gray-400"><I.Filter/></span><h3 className="font-semibold text-gray-700">Advanced Filters</h3><span className="w-4 h-4 text-gray-400"><I.ChevronDown/></span></button>
                  {showFilters&&<div className="grid md:grid-cols-2 gap-4 fade-in">
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Article Type</label><select value={articleType} onChange={e=>setArticleType(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">{ARTICLE_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Discipline</label><select value={discipline} onChange={e=>setDiscipline(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">{DISCIPLINES.map(d=><option key={d} value={d}>{d}</option>)}</select></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Open Access</label><select value={oaPref} onChange={e=>setOaPref(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"><option>Any</option><option>Open Access Only</option><option>Hybrid</option></select></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Impact Target</label><select value={targetImpact} onChange={e=>setTargetImpact(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"><option value="">Any</option><option>Q1 (High)</option><option>Q1-Q2</option><option>Q2-Q3</option><option>Q3-Q4</option></select></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Max APC (USD)</label><input type="number" value={maxApc} onChange={e=>setMaxApc(e.target.value)} placeholder="No limit" className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"/></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Min Impact Factor</label><input type="number" step="0.1" value={minIF} onChange={e=>setMinIF(e.target.value)} placeholder="No minimum" className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"/></div>
                    <div className="flex items-center gap-2 col-span-2"><input type="checkbox" checked={apcFree} onChange={e=>setApcFree(e.target.checked)} className="w-4 h-4 text-[#14B8A6] rounded"/><label className="text-sm text-gray-700">Free to publish only (no APC)</label></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Number of Results</label><input type="range" min="1" max="10" value={numResults} onChange={e=>setNumResults(parseInt(e.target.value))} className="w-full accent-[#14B8A6]"/><span className="text-sm text-gray-600">{numResults} journal{numResults>1?'s':''}</span></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Required Indexing</label><div className="flex flex-wrap gap-1 max-h-24 overflow-y-auto">{INDEXING.map(ix=><button key={ix} type="button" onClick={()=>setIndexing(prev=>prev.includes(ix)?prev.filter(i=>i!==ix):[...prev,ix])} className={`px-2 py-0.5 text-xs rounded-full border transition-colors ${indexing.includes(ix)?'bg-[#14B8A6] text-white border-[#14B8A6]':'border-gray-300 text-gray-600 hover:border-[#14B8A6]'}`}>{ix}</button>)}</div></div>
                  </div>}
                </div>
                {error&&<div className="p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">{error}</div>}
                <button type="submit" disabled={loading} className="w-full py-4 bg-[#14B8A6] text-white font-semibold rounded-lg hover:bg-[#0F9B8E] transition-colors flex items-center justify-center gap-2 disabled:opacity-60">
                  {loading?<><span className="w-5 h-5"><I.Loader/></span>Analyzing...</>:<><span className="w-5 h-5"><I.Search/></span>Find Matching Journals</>}
                </button>
              </div>
            </form>

            {/* RESULTS */}
            <div ref={resultsRef}>
            {results&&<div className="mt-8 space-y-6 fade-in">
              <div className="flex items-center justify-between">
                <h2 className="text-2xl font-bold text-[#1E3A8A]">Results</h2>
                <button onClick={handleReport} className="px-4 py-2 bg-[#1E3A8A] text-white text-sm font-medium rounded-lg hover:bg-[#1E3A8A]/90 transition-colors flex items-center gap-2"><span className="w-4 h-4"><I.Download/></span>Download Report</button>
              </div>
              {results.constraints_relaxed&&<div className="p-3 bg-amber-50 border border-amber-200 rounded-lg text-amber-800 text-sm">⚠️ No journals matched all your constraints. Showing best matches without filters.</div>}
              <p className="text-sm text-gray-600">{results.analysis_summary}</p>
              {results.recommendations?.length===0&&<div className="p-8 bg-white rounded-xl border border-gray-200 text-center"><p className="text-gray-500">No matching journals found. Try broadening your filters or providing more detail in your abstract.</p></div>}
              {results.recommendations?.map((rec,i)=>(
                <div key={i} className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 hover:shadow-md transition-shadow">
                  <div className="flex items-start justify-between mb-3">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 bg-[#1E3A8A] rounded-lg flex items-center justify-center text-white font-bold">{rec.rank}</div>
                      <div>
                        <h3 className="text-lg font-bold text-[#1E3A8A]">{rec.journal_name}</h3>
                        <p className="text-sm text-gray-500">{rec.publisher}</p>
                      </div>
                    </div>
                    <span className={`px-3 py-1 rounded-full text-xs font-semibold ${fitColor(rec.fit)}`}>{rec.fit}</span>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-sm">
                    <div><span className="text-gray-500">OA Model:</span> <span className="font-medium">{rec.oa_model||'N/A'}</span></div>
                    <div><span className="text-gray-500">APC:</span> <span className="font-medium">{rec.apc_estimate||'N/A'}</span></div>
                    <div><span className="text-gray-500">IF:</span> <span className="font-medium">{rec.impact_factor||rec.impact_proxy||'N/A'}</span></div>
                    <div><span className="text-gray-500">Review:</span> <span className="font-medium">{rec.review_time||'N/A'}</span></div>
                  </div>
                  {rec.reasons?.length>0&&<div className="mb-3"><p className="text-sm font-medium text-gray-700 mb-1">Why this journal:</p><ul className="space-y-1">{rec.reasons.map((r,j)=><li key={j} className="text-sm text-gray-600 flex items-start gap-2"><span className="text-[#14B8A6] mt-0.5 flex-shrink-0">✓</span>{r}</li>)}</ul></div>}
                  {rec.concern&&<p className="text-sm text-amber-700 bg-amber-50 px-3 py-2 rounded mb-3">⚠️ {rec.concern}</p>}
                  <div className="flex gap-2 mt-3">
                    <button onClick={()=>handleTailor(rec)} className="px-4 py-2 bg-[#14B8A6] text-white text-sm font-medium rounded-lg hover:bg-[#0F9B8E] transition-colors flex items-center gap-1"><span className="w-4 h-4"><I.FileEdit/></span>Tailor Manuscript</button>
                    {rec.homepage&&<a href={rec.homepage} target="_blank" rel="noopener noreferrer" className="px-4 py-2 border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors flex items-center gap-1"><span className="w-4 h-4"><I.ExternalLink/></span>Journal Homepage</a>}
                  </div>
                </div>
              ))}
            </div>}
            </div>
          </div>

          {/* Sidebar */}
          <div className="space-y-6 fade-in">
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6"><h3 className="font-bold text-[#1E3A8A] mb-4">Quick Tips</h3><ul className="space-y-3">{['Include your main findings in the abstract','Add 3-5 specific keywords for better matches','Use technical terminology from your field','Add Methods & Results sections for precision'].map((t,i)=><li key={i} className="flex items-start gap-2"><span className="w-5 h-5 text-[#14B8A6] flex-shrink-0 mt-0.5"><I.Check/></span><span className="text-sm text-gray-600">{t}</span></li>)}</ul></div>
            <div className="bg-gradient-to-br from-[#1E3A8A] to-[#14B8A6] rounded-xl shadow-sm p-6 text-white"><span className="w-8 h-8 mb-3 block"><I.Sparkles/></span><h3 className="font-bold text-lg mb-2">Powered by AI</h3><p className="text-sm text-gray-100 mb-3">Semantic embedding search + LLM re-ranking across 9,300+ journals from all major publishers.</p><p className="text-xs text-gray-200">Neutral &amp; cross-publisher — no bias.</p></div>
          </div>
        </div>
      </div>

      {/* TAILOR MODAL */}
      {tailorJournal&&<div className="fixed inset-0 bg-black/50 z-50 flex items-start justify-center pt-12 pb-12 px-4 overflow-y-auto" onClick={()=>{setTailorJournal(null);setTailorData(null);}}>
        <div className="bg-white rounded-2xl shadow-2xl max-w-3xl w-full p-8 relative" onClick={e=>e.stopPropagation()}>
          <button onClick={()=>{setTailorJournal(null);setTailorData(null);}} className="absolute top-4 right-4 p-2 hover:bg-gray-100 rounded-lg"><span className="w-5 h-5 text-gray-400"><I.X/></span></button>
          <h2 className="text-2xl font-bold text-[#1E3A8A] mb-1">Tailor Your Manuscript</h2>
          <p className="text-gray-500 mb-6">For: <strong>{tailorJournal.journal_name}</strong></p>
          {tailorLoading&&<div className="flex flex-col items-center py-12 gap-3"><span className="w-8 h-8 text-[#14B8A6]"><I.Loader/></span><p className="text-gray-500">Analyzing your manuscript against this journal's scope, topics, and recent publications...</p></div>}
          {tailorData&&tailorData.error&&<div className="p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">{tailorData.error}</div>}
          {tailorData&&!tailorData.error&&<div className="space-y-5 max-h-[60vh] overflow-y-auto pr-2">
            {tailorData.overall_fit_assessment&&<div className="p-4 bg-[#14B8A6]/5 border border-[#14B8A6]/20 rounded-lg"><h4 className="font-bold text-[#1E3A8A] mb-1">Overall Fit</h4><p className="text-sm text-gray-700">{tailorData.overall_fit_assessment}</p></div>}
            {tailorData.framing&&<div><h4 className="font-bold text-[#1E3A8A] mb-2">Framing</h4><p className="text-sm text-gray-600 mb-1"><strong>Current:</strong> {tailorData.framing.current}</p><p className="text-sm text-gray-600 mb-1"><strong>Suggested:</strong> {tailorData.framing.suggested}</p>{tailorData.framing.opening_angle&&<p className="text-sm text-gray-600"><strong>Opening angle:</strong> {tailorData.framing.opening_angle}</p>}</div>}
            {tailorData.title_suggestions?.length>0&&<div><h4 className="font-bold text-[#1E3A8A] mb-2">Title Suggestions</h4>{tailorData.title_suggestions.map((t,i)=><p key={i} className="text-sm text-gray-600 mb-1">• {t}</p>)}</div>}
            {tailorData.keywords_to_add?.length>0&&<div><h4 className="font-bold text-[#1E3A8A] mb-2">Keywords to Add</h4><div className="flex flex-wrap gap-1">{tailorData.keywords_to_add.map((k,i)=><span key={i} className="px-2 py-1 bg-emerald-50 text-emerald-700 text-xs rounded-full">{k}</span>)}</div></div>}
            {tailorData.keywords_to_avoid?.length>0&&<div><h4 className="font-bold text-[#1E3A8A] mb-2">Keywords to Avoid</h4><div className="flex flex-wrap gap-1">{tailorData.keywords_to_avoid.map((k,i)=><span key={i} className="px-2 py-1 bg-red-50 text-red-700 text-xs rounded-full">{k}</span>)}</div></div>}
            {tailorData.discussion_angles?.length>0&&<div><h4 className="font-bold text-[#1E3A8A] mb-2">Discussion Angles</h4>{tailorData.discussion_angles.map((a,i)=><p key={i} className="text-sm text-gray-600 mb-1">• {a}</p>)}</div>}
            {tailorData.reviewer_concerns?.length>0&&<div><h4 className="font-bold text-[#1E3A8A] mb-2">Anticipated Reviewer Concerns</h4>{tailorData.reviewer_concerns.map((c,i)=><p key={i} className="text-sm text-gray-600 mb-1">⚠️ {c}</p>)}</div>}
            {tailorData.cover_letter_tips?.length>0&&<div><h4 className="font-bold text-[#1E3A8A] mb-2">Cover Letter Tips</h4>{tailorData.cover_letter_tips.map((t,i)=><p key={i} className="text-sm text-gray-600 mb-1">✉️ {t}</p>)}</div>}
            {tailorData.references_strategy&&<div><h4 className="font-bold text-[#1E3A8A] mb-2">References Strategy</h4><p className="text-sm text-gray-600">{tailorData.references_strategy}</p></div>}
          </div>}
        </div>
      </div>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   FEATURES PAGE
   ═══════════════════════════════════════════════════════════════ */
function FeaturesPage(){
  return(
    <div className="bg-white">
      <section className="bg-gradient-to-br from-[#1E3A8A] to-[#14B8A6] text-white py-20"><div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center"><h1 className="text-5xl font-bold mb-6">Powerful Features for Smarter Publishing</h1><p className="text-xl text-gray-100">Everything you need to find the perfect journal and prepare your manuscript for success</p></div></section>
      <section className="py-20"><div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div className="grid md:grid-cols-2 gap-12">{[{icon:<I.Target/>,t:'AI-Powered Journal Matching',d:'Our advanced AI analyzes your abstract, keywords, and research methodology to find journals that truly fit your work.',items:['Semantic understanding of research content','Topic similarity scoring with explanations','Ranked results from 9,300+ journals']},{icon:<I.Filter/>,t:'Advanced Filtering System',d:'Narrow down results with comprehensive filters to find journals that meet your specific requirements.',items:['APC cost range (free to high-fee journals)','Impact Factor and Quartile (Q1/Q2/Q3/Q4)','Review time, acceptance rate, indexing status','Open Access vs. subscription journals']},{icon:<I.Download/>,t:'Export Reports & Documentation',d:'Save your research and share detailed reports with co-authors or advisors.',items:['Export to DOCX with full recommendations','Include tailoring guidance in reports','Share reports with team members']},{icon:<I.Clock/>,t:'Multi-Language Support',d:'Submit abstracts in 9 languages — our system detects the language and boosts journals that publish in your language.',items:['English, Spanish, French, German, Portuguese','Chinese, Japanese, Korean, Arabic','Automatic language detection']}].map((f,i)=><div key={i} className="flex gap-6"><div className="flex-shrink-0"><div className="w-16 h-16 bg-[#14B8A6] rounded-xl flex items-center justify-center text-white"><span className="w-8 h-8">{f.icon}</span></div></div><div><h3 className="text-2xl font-bold text-[#1E3A8A] mb-3">{f.t}</h3><p className="text-gray-600 mb-4">{f.d}</p><ul className="space-y-2">{f.items.map((it,j)=><li key={j} className="flex items-start gap-2"><span className="w-5 h-5 text-[#14B8A6] flex-shrink-0 mt-0.5"><I.Check/></span><span className="text-gray-600">{it}</span></li>)}</ul></div></div>)}</div></div></section>
      <section className="py-20 bg-gradient-to-br from-[#14B8A6] to-[#0F9B8E] text-white"><div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div className="text-center mb-12"><span className="w-12 h-12 mx-auto mb-4 block"><I.Sparkles/></span><h2 className="text-4xl font-bold mb-4">Tailor Your Manuscript</h2><p className="text-xl text-gray-100 max-w-2xl mx-auto">Our standout premium feature: journal-specific guidance to maximize your acceptance chances</p></div></div></section>

function App(){

  return(
    <div className="min-h-screen flex flex-col">
      <Navigation path={path}/>
      <main className="flex-1">
        {page==='home'&&<HomePage/>}
        {page==='dashboard'&&<DashboardPage/>}
        {page==='features'&&<FeaturesPage/>}
        {page==='pricing'&&<PricingPage/>}
        {page==='about'&&<AboutPage/>}
      </main>
      <Footer/>
    </div>
  );
}
