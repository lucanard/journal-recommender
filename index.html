const {useState,useEffect,useCallback,useRef,createContext,useContext}=React;
const API=window.location.origin;
const AuthCtx=createContext({user:null,plan:'anon',loading:true});

function AuthProvider({children}){
  const [user,setUser]=useState(null);
  const [plan,setPlan]=useState('anon');
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    const unsub=fbAuth.onAuthStateChanged(async(u)=>{
      setUser(u);
      if(u){
        try{const doc=await fbDb.collection('users').doc(u.uid).get();if(doc.exists){setPlan(doc.data().plan||'free');}else{await fbDb.collection('users').doc(u.uid).set({plan:'free',email:u.email,created:new Date().toISOString(),searches:0});setPlan('free');}}catch(e){console.error('Firestore:',e);setPlan('free');}
      }else{setPlan('anon');}
      setLoading(false);
    });
    return ()=>unsub();
  },[]);
  return <AuthCtx.Provider value={{user,plan,loading,setPlan}}>{children}</AuthCtx.Provider>;
}
function useAuth(){return useContext(AuthCtx);}
function getFreeSearches(){return parseInt(localStorage.getItem('pubfit_searches')||'0');}
function incFreeSearches(){const n=getFreeSearches()+1;localStorage.setItem('pubfit_searches',String(n));return n;}

function useRouter(){const [path,setPath]=useState(window.location.hash.slice(1)||'/');useEffect(()=>{const h=()=>setPath(window.location.hash.slice(1)||'/');window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h);},[]);return{path,navigate:useCallback((to)=>{window.location.hash=to;window.scrollTo(0,0);},[])}}
function Link({to,children,...p}){return <a href={'#'+to} {...p}>{children}</a>;}

/* AUTH MODAL */
function AuthModal({onClose,initialMode='signup',message}){
  const [mode,setMode]=useState(initialMode);const [email,setEmail]=useState('');const [pw,setPw]=useState('');const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
  async function go(e){e.preventDefault();setErr('');setBusy(true);try{if(mode==='signup')await fbAuth.createUserWithEmailAndPassword(email,pw);else await fbAuth.signInWithEmailAndPassword(email,pw);onClose();}catch(er){const m={'auth/email-already-in-use':'Email already registered — try logging in.','auth/weak-password':'Password must be at least 6 characters.','auth/user-not-found':'No account with this email.','auth/wrong-password':'Incorrect password.','auth/invalid-email':'Invalid email.','auth/invalid-credential':'Invalid email or password.'};setErr(m[er.code]||er.message);}finally{setBusy(false);}}
  async function google(){setErr('');try{await fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider());onClose();}catch(er){setErr(er.message);}}
  return(<div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={onClose}><div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 fade-in relative" onClick={e=>e.stopPropagation()}>
    <button onClick={onClose} className="absolute top-4 right-4 p-2 hover:bg-gray-100 rounded-lg"><span className="w-5 h-5 text-gray-400"><I.X/></span></button>
    <div className="text-center mb-6"><div className="w-16 h-16 bg-gradient-to-br from-[#1E3A8A] to-[#14B8A6] rounded-xl flex items-center justify-center mx-auto mb-4"><span className="text-white text-2xl font-bold">P</span></div><h2 className="text-2xl font-bold text-[#1E3A8A]">{mode==='signup'?'Create your free account':'Welcome back'}</h2>{message&&<p className="text-gray-600 mt-2 text-sm">{message}</p>}</div>
    <button onClick={google} className="w-full py-3 px-4 border-2 border-gray-300 rounded-lg font-semibold text-gray-700 hover:bg-gray-50 transition-colors flex items-center justify-center gap-3 mb-4"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Continue with Google</button>
    <div className="relative mb-4"><div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-300"></div></div><div className="relative flex justify-center text-sm"><span className="px-4 bg-white text-gray-500">Or use email</span></div></div>
    <form onSubmit={go} className="space-y-4"><div><label className="block text-sm font-semibold text-gray-700 mb-1">Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@university.edu" className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent" required/></div><div><label className="block text-sm font-semibold text-gray-700 mb-1">Password</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder={mode==='signup'?'Min 6 characters':'Password'} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent" required minLength="6"/></div>{err&&<div className="p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">{err}</div>}<button type="submit" disabled={busy} className="w-full py-3 bg-[#14B8A6] text-white font-semibold rounded-lg hover:bg-[#0F9B8E] disabled:opacity-60">{busy?'Please wait...':mode==='signup'?'Create Free Account':'Sign In'}</button></form>
    <p className="mt-4 text-center text-sm text-gray-600">{mode==='signup'?<>Have an account? <button onClick={()=>{setMode('login');setErr('');}} className="text-[#14B8A6] font-semibold hover:underline">Sign in</button></>:<>No account? <button onClick={()=>{setMode('signup');setErr('');}} className="text-[#14B8A6] font-semibold hover:underline">Sign up free</button></>}</p>
  </div></div>);
}

    <div className="bg-gray-50 rounded-xl p-6 mb-6 text-left"><p className="font-bold text-[#1E3A8A] mb-3">Premium includes:</p><ul className="space-y-2">{['Up to 10 journal matches','Tailor Your Manuscript (AI guidance)','Advanced filters (APC, IF, indexing, OA)','Downloadable DOCX reports','Priority support'].map((f,i)=><li key={i} className="flex items-center gap-2 text-sm text-gray-700"><span className="w-4 h-4 text-[#14B8A6]"><I.Check/></span>{f}</li>)}</ul></div>

  return(<nav className="bg-white border-b border-gray-200 sticky top-0 z-50"><div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div className="flex justify-between items-center h-16">

    <div className="hidden md:flex items-center gap-3">{user?<><div className="flex items-center gap-2 text-sm text-gray-600"><span className="w-4 h-4"><I.User/></span>{user.email?.split('@')[0]}{isPro&&<span className="px-2 py-0.5 bg-[#14B8A6]/10 text-[#14B8A6] text-xs font-bold rounded">PRO</span>}</div><button onClick={()=>fbAuth.signOut()} className="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg" title="Sign out"><span className="w-4 h-4"><I.LogOut/></span></button></>:<><button onClick={()=>setShowAuth('login')} className="text-sm font-medium text-gray-600 hover:text-[#1E3A8A]">Login</button><Link to="/dashboard" className="px-4 py-2 bg-[#14B8A6] text-white text-sm font-medium rounded-lg hover:bg-[#0F9B8E]">Get Started Free</Link></>}</div>
    <button onClick={()=>setOpen(!open)} className="md:hidden p-2 rounded-lg text-gray-600 hover:bg-gray-100">{open?<span className="w-6 h-6"><I.X/></span>:<span className="w-6 h-6"><I.Menu/></span>}</button>
  </div></div>
  {open&&<div className="md:hidden border-t border-gray-200 bg-white px-4 py-4 space-y-3"><Link to="/" className="block py-2 text-sm text-gray-600" onClick={()=>setOpen(false)}>Home</Link><Link to="/features" className="block py-2 text-sm text-gray-600" onClick={()=>setOpen(false)}>Features</Link><Link to="/pricing" className="block py-2 text-sm text-gray-600" onClick={()=>setOpen(false)}>Pricing</Link><Link to="/about" className="block py-2 text-sm text-gray-600" onClick={()=>setOpen(false)}>About</Link>{user?<button onClick={()=>{fbAuth.signOut();setOpen(false);}} className="block py-2 text-sm text-red-600">Sign Out</button>:<Link to="/dashboard" className="block w-full px-4 py-2 bg-[#14B8A6] text-white text-sm rounded-lg text-center" onClick={()=>setOpen(false)}>Get Started</Link>}</div>}
  {showAuth&&<AuthModal onClose={()=>setShowAuth(false)} initialMode={showAuth}/>}

/* DASHBOARD */
function DashboardPage(){
  const {user,plan}=useAuth();const isPremium=plan==='premium';
  const [abs,setAbs]=useState('');const [kw,setKw]=useState('');const [ic,setIc]=useState('');const [mt,setMt]=useState('');const [rs,setRs]=useState('');
  const [at,setAt]=useState('Original Research');const [disc,setDisc]=useState('Any');const [oa,setOa]=useState('Any');const [apcF,setApcF]=useState(false);const [maxA,setMaxA]=useState('');const [minI,setMinI]=useState('');const [ti,setTi]=useState('');const [idx,setIdx]=useState([]);const [nr,setNr]=useState(3);
  const [busy,setBusy]=useState(false);const [err,setErr]=useState('');const [res,setRes]=useState(null);const [sf,setSf]=useState(false);const [sm,setSm]=useState(false);

  const rRef=useRef(null);

  const DS=["Any","Agricultural Sciences","Biochemistry & Molecular Biology","Biomedical Engineering","Chemistry","Clinical Medicine","Computer Science & AI","Earth & Environmental Sciences","Ecology & Evolution","Economics & Business","Education","Engineering","Epidemiology & Public Health","Food Science & Nutrition","Genetics & Genomics","Humanities & Social Sciences","Immunology","Law","Materials Science","Mathematics & Statistics","Microbiology","Neuroscience","Nursing & Health Professions","Pharmacology & Toxicology","Physics & Astronomy","Psychology & Psychiatry","Veterinary Science","Other"];

  function needPrem(f){setPremFeat(f);setShowPrem(true);}

    e.preventDefault();if(abs.length<50){setErr('Abstract must be at least 50 characters.');return;}

    setErr('');setBusy(true);setRes(null);setTj(null);setTd(null);

      const en=isPremium?nr:3;
      const body={abstract:abs,keywords:kw,introduction_conclusion:ic,methods:mt,results_summary:rs,article_type:at,discipline:disc,indexing_required:isPremium?idx:[],oa_preference:isPremium?oa:'Any',apc_free_only:isPremium?apcF:false,max_apc:isPremium&&maxA?parseFloat(maxA):null,min_impact_factor:isPremium&&minI?parseFloat(minI):null,target_impact:isPremium&&ti?ti:null,num_results:en,language_preference:'auto'};
      const r=await fetch(API+'/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

      const data=await r.json();setRes(data);
      if(!user)incFreeSearches();else try{fbDb.collection('users').doc(user.uid).update({searches:firebase.firestore.FieldValue.increment(1)});}catch(x){}
      setTimeout(()=>rRef.current?.scrollIntoView({behavior:'smooth'}),100);
    }catch(x){setErr(x.message);}finally{setBusy(false);}
  }
  async function doTailor(rec){

  }
  async function doReport(){

  }

        <div><label className="block text-sm font-semibold text-gray-700 mb-2">Abstract *</label><textarea value={abs} onChange={e=>setAbs(e.target.value)} placeholder="Paste your research abstract here..." className="w-full h-48 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent resize-none"/><p className="text-sm text-gray-500 mt-1">Min 50 chars ({abs.length})</p></div>
        <div><label className="block text-sm font-semibold text-gray-700 mb-2">Keywords</label><input type="text" value={kw} onChange={e=>setKw(e.target.value)} placeholder="e.g., machine learning, neural networks" className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent"/></div>
        <button type="button" onClick={()=>setSm(!sm)} className="text-sm text-[#14B8A6] font-semibold hover:underline">{sm?'▾ Hide':'▸ Show'} extra sections (optional)</button>
        {sm&&<div className="space-y-4 pl-4 border-l-2 border-[#14B8A6]/20"><div><label className="block text-sm font-medium text-gray-700 mb-1">Introduction / Conclusion</label><textarea value={ic} onChange={e=>setIc(e.target.value)} placeholder="Paste intro/conclusion..." className="w-full h-24 px-3 py-2 border border-gray-300 rounded-lg text-sm resize-none"/></div><div><label className="block text-sm font-medium text-gray-700 mb-1">Methods</label><textarea value={mt} onChange={e=>setMt(e.target.value)} placeholder="Paste methods..." className="w-full h-24 px-3 py-2 border border-gray-300 rounded-lg text-sm resize-none"/></div><div><label className="block text-sm font-medium text-gray-700 mb-1">Results</label><textarea value={rs} onChange={e=>setRs(e.target.value)} placeholder="Key results..." className="w-full h-24 px-3 py-2 border border-gray-300 rounded-lg text-sm resize-none"/></div></div>}
        <div className="grid md:grid-cols-2 gap-4"><div><label className="block text-sm font-medium text-gray-700 mb-1">Article Type</label><select value={at} onChange={e=>setAt(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">{AT.map(t=><option key={t}>{t}</option>)}</select></div><div><label className="block text-sm font-medium text-gray-700 mb-1">Discipline</label><select value={disc} onChange={e=>setDisc(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">{DS.map(d=><option key={d}>{d}</option>)}</select></div></div>
        <div className="border-t pt-6"><button type="button" onClick={()=>{if(!isPremium){needPrem('Advanced Filters');return;}setSf(!sf);}} className="flex items-center gap-2 mb-4"><span className="w-5 h-5 text-gray-400"><I.Filter/></span><h3 className="font-semibold text-gray-700">Advanced Filters</h3>{!isPremium&&<span className="px-2 py-0.5 bg-[#14B8A6]/10 text-[#14B8A6] text-xs font-bold rounded flex items-center gap-1"><span className="w-3 h-3"><I.Lock/></span>Premium</span>}{isPremium&&<span className="w-4 h-4 text-gray-400"><I.ChevronDown/></span>}</button>
        {sf&&isPremium&&<div className="grid md:grid-cols-2 gap-4 fade-in">
