const REFERENCES_FEATURE_ENABLED=false;

/* AUTH CONTEXT — credits-aware
 * Firestore schema for users/{uid}:
 *   email: string
 *   created: ISO timestamp
 *   credits: number — current balance
 *   credits_expire_at: ISO timestamp | null — 1yr from last purchase, null = never had credits
 *   total_searches: number — lifetime counter
 *   purchases: [{amount, credits, purchased_at, expires_at, stripe_session_id}]
 *   accepted_terms_at: ISO timestamp — set on signup
 */
const AuthCtx=createContext({user:null,credits:0,creditsExpireAt:null,totalSearches:0,loading:true,refreshUserDoc:()=>{}});

function isExpired(iso){if(!iso)return true;return new Date(iso).getTime()<Date.now();}

function AuthProvider({children}){
  const [user,setUser]=useState(null);
  const [credits,setCredits]=useState(0);
  const [creditsExpireAt,setCreditsExpireAt]=useState(null);
  const [totalSearches,setTotalSearches]=useState(0);
  const [loading,setLoading]=useState(true);
  /* All writes use set(..., {merge:true}) for consistency:
   *   - works whether doc exists or not (no update-on-missing failures)
   *   - only touches specified fields (won't clobber stripe-written fields later)
   *   - single rule predicate applies to all paths (no create-vs-update mismatch)
   */
  const refreshUserDoc=useCallback(async(u)=>{
    if(!u)return;
    try{
      const ref=fbDb.collection('users').doc(u.uid);
      const doc=await ref.get();
      if(!doc.exists){
        // First login: initialize empty profile
        const init={email:u.email,created:new Date().toISOString(),credits:0,credits_expire_at:null,total_searches:0,purchases:[]};
        await ref.set(init,{merge:true});
        setCredits(0);setCreditsExpireAt(null);setTotalSearches(0);
        return;
      }
      const d=doc.data();
      // Migration: doc exists but lacks `credits` field (pre-credits-system account)
      if(typeof d.credits==='undefined'){
        const legacyCredits=d.plan==='premium'?60:0;
        const expiry=legacyCredits>0?new Date(Date.now()+365*24*3600*1000).toISOString():null;
        const migrated={credits:legacyCredits,credits_expire_at:expiry,total_searches:d.searches||0,purchases:d.purchases||[]};
        await ref.set(migrated,{merge:true});
        setCredits(legacyCredits);setCreditsExpireAt(expiry);setTotalSearches(d.searches||0);
        return;
      }
      // Normal path: doc already has credits field
      setCredits(d.credits||0);
      setCreditsExpireAt(d.credits_expire_at||null);
      setTotalSearches(d.total_searches||d.searches||0);
    }catch(e){console.error('Firestore sync failed:',e);setCredits(0);setCreditsExpireAt(null);}
  },[]);
  useEffect(()=>{
    const unsub=fbAuth.onAuthStateChanged(async(u)=>{
      setUser(u);
      if(u){await refreshUserDoc(u);}else{setCredits(0);setCreditsExpireAt(null);setTotalSearches(0);}
      setLoading(false);
    });
    return()=>unsub();
  },[refreshUserDoc]);
  const hasCredits=user&&credits>0&&!isExpired(creditsExpireAt);
  return <AuthCtx.Provider value={{user,credits,creditsExpireAt,totalSearches,hasCredits,loading,refreshUserDoc:()=>refreshUserDoc(user)}}>{children}</AuthCtx.Provider>;
}
function useAuth(){return useContext(AuthCtx);}

function useRouter(){const [path,setPath]=useState(window.location.hash.slice(1)||'/');useEffect(()=>{const h=()=>setPath(window.location.hash.slice(1)||'/');window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h);},[]);return{path,navigate:useCallback((to)=>{window.location.hash=to;window.scrollTo(0,0);},[])}}
function Link({to,children,...p}){return <a href={'#'+to} {...p}>{children}</a>;}

/* AUTH MODAL — with terms checkbox on signup */
function AuthModal({onClose,initialMode='signup',message}){
  const [mode,setMode]=useState(initialMode);const [email,setEmail]=useState('');const [pw,setPw]=useState('');const [agreed,setAgreed]=useState(false);const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
  async function go(e){
    e.preventDefault();setErr('');
    if(mode==='signup'&&!agreed){setErr('You must agree to the Terms and Privacy Policy to create an account.');return;}
    setBusy(true);
    try{
      if(mode==='signup'){
        const cred=await fbAuth.createUserWithEmailAndPassword(email,pw);
        // Record acceptance timestamp on user doc
        try{await fbDb.collection('users').doc(cred.user.uid).set({email,created:new Date().toISOString(),credits:0,credits_expire_at:null,total_searches:0,purchases:[],accepted_terms_at:new Date().toISOString()},{merge:true});}catch(x){console.error('Profile init:',x);}
      }else{
        await fbAuth.signInWithEmailAndPassword(email,pw);
      }
      onClose();
    }catch(er){
      const m={'auth/email-already-in-use':'Email already registered — try logging in.','auth/weak-password':'Password must be at least 6 characters.','auth/user-not-found':'No account with this email.','auth/wrong-password':'Incorrect password.','auth/invalid-email':'Invalid email.','auth/invalid-credential':'Invalid email or password.'};
      setErr(m[er.code]||er.message);
    }finally{setBusy(false);}
  }
  async function google(){
    setErr('');
    if(mode==='signup'&&!agreed){setErr('You must agree to the Terms and Privacy Policy to create an account.');return;}
    try{
      const cred=await fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      // For Google signup, set acceptance timestamp if it's a new user
      if(cred.additionalUserInfo?.isNewUser){
        try{await fbDb.collection('users').doc(cred.user.uid).set({email:cred.user.email,created:new Date().toISOString(),credits:0,credits_expire_at:null,total_searches:0,purchases:[],accepted_terms_at:new Date().toISOString()},{merge:true});}catch(x){console.error('Profile init:',x);}
      }
      onClose();
    }catch(er){setErr(er.message);}
  }
  return(<div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={onClose}><div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 fade-in relative" onClick={e=>e.stopPropagation()}>
    <button onClick={onClose} className="absolute top-4 right-4 p-2 hover:bg-gray-100 rounded-lg"><span className="w-5 h-5 text-gray-400"><I.X/></span></button>
    <div className="text-center mb-6"><div className="w-16 h-16 bg-gradient-to-br from-[#1E3A8A] to-[#14B8A6] rounded-xl flex items-center justify-center mx-auto mb-4"><span className="text-white text-2xl font-bold">P</span></div><h2 className="text-2xl font-bold text-[#1E3A8A]">{mode==='signup'?'Create your free account':'Welcome back'}</h2>{message&&<p className="text-gray-600 mt-2 text-sm">{message}</p>}</div>
    <button onClick={google} className="w-full py-3 px-4 border-2 border-gray-300 rounded-lg font-semibold text-gray-700 hover:bg-gray-50 transition-colors flex items-center justify-center gap-3 mb-4"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Continue with Google</button>
    <div className="relative mb-4"><div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-300"></div></div><div className="relative flex justify-center text-sm"><span className="px-4 bg-white text-gray-500">Or use email</span></div></div>
    <form onSubmit={go} className="space-y-4">
      <div><label className="block text-sm font-semibold text-gray-700 mb-1">Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@university.edu" className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent" required/></div>
      <div><label className="block text-sm font-semibold text-gray-700 mb-1">Password</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder={mode==='signup'?'Min 6 characters':'Password'} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent" required minLength="6"/></div>
      {mode==='signup'&&<label className="flex items-start gap-2 text-sm text-gray-600"><input type="checkbox" checked={agreed} onChange={e=>setAgreed(e.target.checked)} className="mt-1 w-4 h-4 text-[#14B8A6] rounded"/><span>I agree to the <Link to="/terms" className="text-[#14B8A6] hover:underline" onClick={onClose}>Terms of Service</Link> and <Link to="/privacy" className="text-[#14B8A6] hover:underline" onClick={onClose}>Privacy Policy</Link>.</span></label>}
      {err&&<div className="p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">{err}</div>}
      <button type="submit" disabled={busy} className="w-full py-3 bg-[#14B8A6] text-white font-semibold rounded-lg hover:bg-[#0F9B8E] disabled:opacity-60">{busy?'Please wait...':mode==='signup'?'Create Free Account':'Sign In'}</button>
    </form>
    <p className="mt-4 text-center text-sm text-gray-600">{mode==='signup'?<>Have an account? <button onClick={()=>{setMode('login');setErr('');}} className="text-[#14B8A6] font-semibold hover:underline">Sign in</button></>:<>No account? <button onClick={()=>{setMode('signup');setErr('');}} className="text-[#14B8A6] font-semibold hover:underline">Sign up free</button></>}</p>
  </div></div>);
}

/* CREDIT BADGE — shown in nav for logged-in users */
function CreditBadge({credits,creditsExpireAt}){
  const expired=isExpired(creditsExpireAt);
  if(credits<=0||expired)return <span className="px-2 py-0.5 bg-gray-100 text-gray-600 text-xs font-bold rounded">FREE</span>;
  const days=Math.ceil((new Date(creditsExpireAt).getTime()-Date.now())/(24*3600*1000));
  const expiringSoon=days<=30;
  return(<span className={`px-2 py-0.5 text-xs font-bold rounded flex items-center gap-1 ${expiringSoon?'bg-amber-100 text-amber-800':'bg-[#14B8A6]/10 text-[#14B8A6]'}`} title={`Credits expire in ${days} day${days===1?'':'s'} (${new Date(creditsExpireAt).toLocaleDateString()})`}><span className="w-3 h-3"><I.Coin/></span>{credits}</span>);
}

function DashboardPage(){
  const {user,credits,hasCredits,refreshUserDoc}=useAuth();
  const [abs,setAbs]=useState('');const [kw,setKw]=useState('');const [ic,setIc]=useState('');const [mt,setMt]=useState('');const [rs,setRs]=useState('');const [refs,setRefs]=useState('');
  const [at,setAt]=useState('Original Research');const [disc,setDisc]=useState('Any');const [oa,setOa]=useState('Any');const [apcF,setApcF]=useState(false);const [maxA,setMaxA]=useState('');const [minI,setMinI]=useState('');const [ti,setTi]=useState('');const [idx,setIdx]=useState([]);
  const [busy,setBusy]=useState(false);const [err,setErr]=useState('');const [res,setRes]=useState(null);const [sf,setSf]=useState(false);const [sm,setSm]=useState(false);
  const [tj,setTj]=useState(null);const [td,setTd]=useState(null);const [tl,setTl]=useState(false);
  const [showAuth,setShowAuth]=useState(false);const [authMsg,setAuthMsg]=useState('');const [showCredits,setShowCredits]=useState(false);const [creditFeat,setCreditFeat]=useState('');

    const params=new URLSearchParams(window.location.search);

        refreshUserDoc&&refreshUserDoc();

      try{
        const updates={total_searches:firebase.firestore.FieldValue.increment(1)};
        if(hasCredits){updates.credits=firebase.firestore.FieldValue.increment(-1);}

    }catch(x){setErr(x.message);}finally{setBusy(false);}
  }

  }

  }

  return(<div className="bg-gray-50 min-h-screen py-12"><div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

      {user&&!hasCredits&&<div className="mt-3 inline-flex items-center gap-2 px-4 py-2 bg-gray-100 rounded-lg text-sm text-gray-700"><span className="w-4 h-4"><I.Coin/></span>0 credits — searches limited to 3 results, no filters or tailoring. <Link to="/pricing" className="ml-1 text-[#14B8A6] font-semibold hover:underline">Get credits →</Link></div>}
      {purchaseOK&&<div className="mt-4 p-4 bg-emerald-50 border border-emerald-200 rounded-lg text-emerald-800 text-sm flex items-start gap-2"><span className="w-5 h-5 flex-shrink-0 mt-0.5"><I.Check/></span><div><strong>Payment successful — credits added to your account.</strong> {credits>0?`You now have ${credits} credit${credits===1?'':'s'}.`:'Your credits will appear in a few seconds (refresh if needed).'}</div></div>}
    </div>
    <div className="grid lg:grid-cols-3 gap-8"><div className="lg:col-span-2">
      <form onSubmit={doSearch} className="bg-white rounded-xl shadow-sm border border-gray-200 p-8 fade-in"><h2 className="text-2xl font-bold text-[#1E3A8A] mb-6">New Search</h2><div className="space-y-6">
        <div><label className="block text-sm font-semibold text-gray-700 mb-2">Abstract *</label><textarea value={abs} onChange={e=>setAbs(e.target.value)} placeholder="Paste your research abstract here..." className="w-full h-48 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent resize-none"/><p className="text-sm text-gray-500 mt-1">Min 50 chars ({abs.length})</p></div>
        {REFERENCES_FEATURE_ENABLED&&<div><div className="flex items-center gap-2 mb-2"><label className="block text-sm font-semibold text-gray-700">References</label><span className="px-2 py-0.5 bg-[#14B8A6]/10 text-[#14B8A6] text-xs font-bold rounded">Highly recommended</span></div><p className="text-xs text-gray-600 mb-2">Paste your full reference list — any common style.</p><textarea value={refs} onChange={e=>setRefs(e.target.value)} placeholder={"1. Smith J, Jones R. ..."} className="w-full h-32 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#14B8A6] focus:border-transparent resize-none font-mono text-xs"/></div>}

        {sm&&<div className="space-y-4 pl-4 border-l-2 border-[#14B8A6]/20"><div><label className="block text-sm font-medium text-gray-700 mb-1">Introduction / Conclusion</label><textarea value={ic} onChange={e=>setIc(e.target.value)} placeholder="Paste intro/conclusion..." className="w-full h-24 px-3 py-2 border border-gray-300 rounded-lg text-sm resize-none"/></div><div><label className="block text-sm font-medium text-gray-700 mb-1">Methods</label><textarea value={mt} onChange={e=>setMt(e.target.value)} placeholder="Paste methods..." className="w-full h-24 px-3 py-2 border border-gray-300 rounded-lg text-sm resize-none"/></div><div><label className="block text-sm font-medium text-gray-700 mb-1">Results</label><textarea value={rs} onChange={e=>setRs(e.target.value)} placeholder="Key results..." className="w-full h-24 px-3 py-2 border border-gray-300 rounded-lg text-sm resize-none"/></div></div>}

      </div></form>
      {/* RESULTS */}
      <div ref={rRef}>{res&&<div className="mt-8 space-y-6 fade-in">
        <div className="flex items-center justify-between"><h2 className="text-2xl font-bold text-[#1E3A8A]">Results</h2><button onClick={doReport} className="px-4 py-2 bg-[#1E3A8A] text-white text-sm font-medium rounded-lg flex items-center gap-2">{!hasCredits&&<span className="w-3 h-3"><I.Lock/></span>}<span className="w-4 h-4"><I.Download/></span>Report</button></div>

/* MARKDOWN-LITE renderer for legal pages — handles #, ##, ###, **bold**, paragraphs, bullet lists, simple tables */
function MdLite({src}){
  const lines=src.split('\n');
  const out=[];let i=0;let key=0;
  const inline=(s)=>{const parts=[];let j=0;let k=0;const re=/\*\*([^*]+)\*\*/g;let m;while((m=re.exec(s))!==null){if(m.index>j)parts.push(s.slice(j,m.index));parts.push(<strong key={k++}>{m[1]}</strong>);j=m.index+m[0].length;}if(j<s.length)parts.push(s.slice(j));return parts;};
  while(i<lines.length){
    const ln=lines[i];
    if(ln.startsWith('# ')){out.push(<h1 key={key++}>{inline(ln.slice(2))}</h1>);i++;}
    else if(ln.startsWith('## ')){out.push(<h2 key={key++}>{inline(ln.slice(3))}</h2>);i++;}
    else if(ln.startsWith('### ')){out.push(<h3 key={key++}>{inline(ln.slice(4))}</h3>);i++;}
    else if(ln.startsWith('- ')){const items=[];while(i<lines.length&&lines[i].startsWith('- ')){items.push(lines[i].slice(2));i++;}out.push(<ul key={key++}>{items.map((t,n)=><li key={n}>{inline(t)}</li>)}</ul>);}
    else if(ln.startsWith('|')){
      // table: header | sep | rows
      const tableLines=[];while(i<lines.length&&lines[i].startsWith('|')){tableLines.push(lines[i]);i++;}
      if(tableLines.length>=2){
        const header=tableLines[0].split('|').slice(1,-1).map(c=>c.trim());
        const rows=tableLines.slice(2).map(r=>r.split('|').slice(1,-1).map(c=>c.trim()));
        out.push(<table key={key++}><thead><tr>{header.map((h,n)=><th key={n}>{inline(h)}</th>)}</tr></thead><tbody>{rows.map((r,n)=><tr key={n}>{r.map((c,m)=><td key={m}>{inline(c)}</td>)}</tr>)}</tbody></table>);
      }
    }
    else if(ln.trim()===''){i++;}
    else{out.push(<p key={key++}>{inline(ln)}</p>);i++;}
  }
  return <div className="legal-content">{out}</div>;
}
