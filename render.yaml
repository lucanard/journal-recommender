# render.yaml — Render Blueprint for Journal Recommender
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: journal-recommender
    runtime: python
    plan: free          # Change to "starter" ($7/mo) for always-on
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: python app.py --data-dir data --llm gemini --embedding-provider gemini --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini

      # ─── Vertex AI, EU (Gemini Enterprise Agent Platform) ──
      # NOTE: the live service is configured in the Render dashboard and does
      # not read this file; these entries document what to set there.
      # The LLM runs ONLY on Vertex AI (EU multi-region): without Vertex
      # credentials it is disabled and Match ranks heuristically. Query
      # embeddings use Vertex once the startup self-check passes.
      # Credentials: a dedicated service account (never the Firebase Admin
      # one), uploaded as a Secret File at /etc/secrets/vertex-ai.json
      # (default path, see DEPLOY.md).
      - key: VERTEX_PROJECT_ID
        value: pubfit-1a5ad
      - key: VERTEX_LOCATION
        value: eu               # text generation. EU locations only; global/us/London/Zurich refuse to start
      # Embeddings run in an EU REGION: gemini-embedding-001 is not served on
      # the eu multi-region (404), europe-west4 serves it. Same EU allowlist;
      # "eu" passes it but the self-check then fails. Default: europe-west4.
      - key: VERTEX_EMBEDDING_LOCATION
        value: europe-west4
      # Optional alternative to the Secret File: the same JSON inline.
      # - key: VERTEX_CREDENTIALS_JSON
      #   sync: false
      # Optional: Secret File somewhere else.
      # - key: VERTEX_CREDENTIALS_FILE
      #   value: /etc/secrets/vertex-ai.json

      # ─── Gemini API key: TEMPORARY embeddings fallback only ─
      # Used for query embeddings only while the Vertex self-check fails
      # (/health ai_backends.embeddings = "api_key_fallback"). Never used for
      # text generation. Delete it once /health reports "vertex".
      - key: GEMINI_API_KEY
        sync: false

      # ─── Payments ─────────────────────────────────────────
      # Both are set in the Render dashboard, never committed.
      # STRIPE_SECRET_KEY      → Stripe > Developers > API keys (sk_live_…)
      # STRIPE_WEBHOOK_SECRET  → signing secret of the /stripe-webhook endpoint (whsec_…)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # ─── Public URL ───────────────────────────────────────
      # Where Stripe sends the customer back after checkout, and the default
      # CORS origin. Must match the domain actually serving the app, which is
      # app.pubfit.ai. pubfit.ai and www.pubfit.ai were handed to the PubFit
      # marketing site (the lucanard/reviewpro-website repo, Render service
      # reviewpro-site), so a pubfit.ai value here would return paying
      # customers from Stripe to marketing pages instead of their dashboard.
      # Unset, app.py falls back to https://app.pubfit.ai.
      #
      # The success and cancel URLs are built from this value on every
      # checkout. The webhook endpoint is registered in the Stripe dashboard
      # and has to be https://app.pubfit.ai/stripe-webhook.
      - key: PUBLIC_BASE_URL
        value: https://app.pubfit.ai

      # ─── Access control ───────────────────────────────────
      # AUTH_ENFORCED requires a verified Firebase ID token on the paid
      # endpoints. Turning it off opens them to anonymous callers — local
      # development only. It needs the Firebase Admin credentials below.
      - key: AUTH_ENFORCED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      # Comma-separated. Leave unset to derive it from PUBLIC_BASE_URL (plus
      # app.pubfit.ai and the localhost / 127.0.0.1 port 8000 dev origins). The
      # frontend is same-origin, so only a page on another site that calls
      # this API needs an entry here.
      # - key: ALLOWED_ORIGINS
      #   value: https://app.pubfit.ai

# ─── Firebase Admin credentials ───────────────────────────────
# Required for credit accounting AND for token verification, so the service
# will refuse the paid endpoints without it. Upload the service-account JSON
# in the Render dashboard as a Secret File at this exact path — it is the
# first location app.py looks in:
#
#   /etc/secrets/firebase-admin.json
#
# Generate it at: Firebase console > Project settings > Service accounts >
# Generate new private key. Never commit this file.
    autoDeploy: true           # Redeploy on git push
