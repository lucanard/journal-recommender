# render.yaml — Render Blueprint for Journal Recommender
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: journal-recommender
    runtime: python
    plan: free          # Change to "starter" ($7/mo) for always-on
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: python app.py --data-dir data --llm gemini --embedding-provider gemini --host 0.0.0.0 --port $PORT
    envVars:
      # ─── Single API key for both LLM and embeddings ────────
      - key: GEMINI_API_KEY
        sync: false            # You'll set this in Render dashboard
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini

      # ─── Vertex AI, EU (Gemini Enterprise Agent Platform) ──
      # NOTE: the live service is configured in the Render dashboard and does
      # not read this file; these entries document what to set there.
      # With Vertex credentials present, LLM re-ranking runs on Vertex AI in
      # the EU multi-region, and so do query embeddings once the startup
      # self-check passes. GEMINI_API_KEY then remains only as a fallback.
      # Credentials: upload the Vertex service-account JSON as a Secret File
      # at /etc/secrets/vertex-ai.json (default path, see DEPLOY.md).
      - key: VERTEX_PROJECT_ID
        value: pubfit-1a5ad
      - key: VERTEX_LOCATION
        value: eu               # EU locations only; global/us/London/Zurich refuse to start
      # Optional alternative to the Secret File: the same JSON inline.
      # - key: VERTEX_CREDENTIALS_JSON
      #   sync: false
      # Optional: Secret File somewhere else.
      # - key: VERTEX_CREDENTIALS_FILE
      #   value: /etc/secrets/vertex-ai.json
      # Optional: embedding task type for Vertex. Leave unset: the stored
      # journal vectors were built without one and the self-check validates it.
      # - key: VERTEX_EMBEDDING_TASK_TYPE
      #   value: RETRIEVAL_QUERY

      # ─── Payments ─────────────────────────────────────────
      # Both are set in the Render dashboard, never committed.
      # STRIPE_SECRET_KEY      → Stripe > Developers > API keys (sk_live_…)
      # STRIPE_WEBHOOK_SECRET  → signing secret of the /stripe-webhook endpoint (whsec_…)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # ─── Public URL ───────────────────────────────────────
      # Where Stripe sends the customer back after checkout, and the default
      # CORS origin. Must match the domain actually serving the app, which is
      # the subdomain: pubfit.ai is being handed to the PubFit marketing site
      # (the lucanard/pubfit-website repo, Render service reviewpro-site) and
      # this service keeps app.pubfit.ai, already attached and verified with
      # its certificate issued.
      #
      # This value has to be the subdomain BEFORE pubfit.ai is detached from
      # this service. In the other order there is a window where a paying
      # customer returns from Stripe to a pubfit.ai that now serves marketing
      # pages instead of their dashboard.
      #
      # The remaining half of the move is outside this repo: the success and
      # cancel URLs and the webhook endpoint registered in the Stripe
      # dashboard.
      - key: PUBLIC_BASE_URL
        value: https://app.pubfit.ai

      # ─── Access control ───────────────────────────────────
      # AUTH_ENFORCED requires a verified Firebase ID token on the paid
      # endpoints. Turning it off opens them to anonymous callers — local
      # development only. It needs the Firebase Admin credentials below.
      - key: AUTH_ENFORCED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      # Comma-separated. Leave unset to derive it from PUBLIC_BASE_URL
      # (plus the pubfit.ai / app.pubfit.ai transition origins).
      # - key: ALLOWED_ORIGINS
      #   value: https://pubfit.ai,https://www.pubfit.ai,https://app.pubfit.ai

# ─── Firebase Admin credentials ───────────────────────────────
# Required for credit accounting AND for token verification, so the service
# will refuse the paid endpoints without it. Upload the service-account JSON
# in the Render dashboard as a Secret File at this exact path — it is the
# first location app.py looks in:
#
#   /etc/secrets/firebase-admin.json
#
# Generate it at: Firebase console > Project settings > Service accounts >
# Generate new private key. Never commit this file.
    autoDeploy: true           # Redeploy on git push
